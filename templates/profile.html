{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>admin_views</title>
</head>
<style>
header {
   background-color:#333;
    color: #fff;
    text-align: center;
    padding: 40px;
}
table {
  width: 100%;
  border-collapse: collapse;
  margin: 20px 0;
  font-family: Arial, sans-serif;
}
th {
  background-color: #f2f2f2;
  text-align: left;
  padding: 10px;
}
tr {
  border-bottom: 1px solid #ddd;
}
tr:nth-child(even) {
  background-color: #f2f2f2;
}
td {
  padding: 10px;
}
tr:hover {
  background-color: #ddd;
}
</style>
<body> 
    <center>
         <header>
        <h2><marquee direction="right">PROFILE</marquee></h2>
         </header>
    </center>
    <center><h2>Profile Details</h2></center>
<table border='5' align='center'>
    <tr>
        <td colspan="2">
        </td>
    </tr>
{%for x in online %}
<tr>
    <th> Id</th>
    <td>{{x.id}}</td>
</tr>
<tr>
    <th>FirstName</th>
    <td>{{x.first_name}}</td>
</tr>
<tr>
    <th>Last Name</th>
    <td>{{x.last_name}}</td>
</tr>
<tr>
    <th>Email Id</th> 
    <td>{{x.email}}</td>
</tr>
<tr>
    <th>Password</th>
    <td>{{x.password}}</td> 
</tr>
{%endfor%}
<tr></tr>
</table>
<form method="post" enctype="multipart/form-data">
    <table>
      {%for image in images%}
    <tr>
      <td>
        {{image.imagename}}
        <img src="{{ image.imagename.url }}" height="200" width="200"/>
      </td>
    </tr>
    {%endfor%}
</table>
</form>
<a href="{%url 'logout'%}">logout</a>
</body>
</html>
